<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Project Marienbad：以架构、流程与证据理清 AI 事务。"><title>Project Marienbad · 项目认知地图</title><link rel="stylesheet" href="style.css"></head>
<body><a class="skip" href="#content">跳到项目图谱</a>
<aside class="sidebar">
  <a class="brand" href="#all">PROJECT MARIENBAD</a>
  <label class="search-label" for="search">搜索项目或组件</label>
  <input id="search" type="search" placeholder="名称、目标、组件…" autocomplete="off">
  <nav class="main-nav" aria-label="视图">
    <a href="#all" id="all-link">项目索引 <span id="total"></span></a>
    <a href="#relations" id="relations-link">跨项目关系 <span id="relation-count"></span></a>
  </nav>
  <details id="index-panel">
    <summary>项目索引 <span id="match-count"></span></summary>
    <label class="grouping">索引分组 <select id="grouping"><option value="group">按领域</option><option value="stage">按状态</option></select></label>
    <nav id="project-nav" aria-label="项目索引"></nav>
  </details>
  <div class="sidebar-bottom"><span id="edition-label">工作版</span><br></div>
</aside>
<main id="content">
  <header class="topbar"><h1>项目图谱</h1></header>
  <section class="toolbar" aria-label="图谱筛选">
    <label>领域 <select id="group-filter"></select></label>
    <label>状态 <select id="stage-filter"></select></label>
    <button id="reset-filters" type="button" hidden>清除筛选</button>
  </section>
  <div id="atlas"></div>
  <p id="empty" hidden>当前筛选没有匹配结果。</p>
</main>
<dialog id="detail-dialog"><div class="dialog-head"><span id="detail-kind"></span><button data-close="detail-dialog" aria-label="关闭详情">×</button></div><h2 id="detail-title"></h2><p id="detail-text"></p><div id="detail-connections"></div><div id="detail-source"></div></dialog>

<div id="toast" role="status" aria-live="polite"></div><script src="data.js"></script><script src="app.js"></script></body></html>
